name: Build Mi Finanzas with JARVIS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "nueva-web/**"
      - "jarvis-memory.js"
      - "jarvis-tools.js"
      - "jarvis-web.js"
      - "jarvis-research.js"
      - "jarvis-products.js"
      - "api/**"
      - "sw.js"
      - "tests/**"
      - ".github/workflows/build-jarvis-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check JARVIS JavaScript syntax
        run: node --check jarvis-memory.js
      - name: Test JARVIS memory module
        run: node --test tests/jarvis-memory.test.cjs
      - name: Check JARVIS tools syntax
        run: node --check jarvis-tools.js
      - name: Test JARVIS tools
        run: node --test tests/jarvis-tools.test.cjs
      - name: Check web search API syntax
        run: node --check api/jarvis-search.js
      - name: Test web search API
        run: node --test tests/jarvis-search.test.cjs
      - name: Check public page API syntax
        run: node --check api/jarvis-page.js
      - name: Test public page extraction
        run: node --test tests/jarvis-page.test.cjs
      - name: Check product page API syntax
        run: node --check api/jarvis-product.js
      - name: Test product page extraction
        run: node --test tests/jarvis-product.test.cjs
      - name: Check JARVIS research module syntax
        run: node --check jarvis-research.js
      - name: Test JARVIS deep research planner
        run: node --test tests/jarvis-research.test.cjs
      - name: Check JARVIS web module syntax
        run: node --check jarvis-web.js
      - name: Test JARVIS web module
        run: node --test tests/jarvis-web.test.cjs
      - name: Check JARVIS products syntax
        run: node --check jarvis-products.js
      - name: Test JARVIS products module
        run: node --test tests/jarvis-products.test.cjs
      - name: Check inline application scripts (Mi Finanzas y nueva web)
        run: node tests/check-inline-scripts.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-local-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
