name: Build Mi Finanzas with JARVIS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "jarvis-memory.js"
      - "sw.js"
      - ".github/workflows/build-jarvis-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check JARVIS JavaScript syntax
        run: node --check jarvis-memory.js
      - name: Test JARVIS memory module
        run: node --test tests/jarvis-memory.test.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-local-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
